name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so advisories published after a PR merges still surface.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  # Secret scanning over the full git history. Runs the gitleaks binary
  # directly rather than a third-party action, so this job stays within the
  # repository's "GitHub-owned and verified actions only" policy.
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks needs history, not just the tip commit.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks git --no-banner --redact --verbose -c .gitleaks.toml .

  # Fails a PR that introduces a dependency with a known advisory, before it
  # lands. Complements Dependabot, which only reports what is already merged.
  # Requires the dependency graph, which is available on public repositories.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Static analysis for injection, XSS, unsafe deserialisation and similar.
  # Free on public repositories; on a private repository this job will not run.
  codeql:
    # Named distinctly from the "CodeQL" check that the code-scanning app
    # posts alongside this job. Two check runs sharing one name make an
    # ambiguous required status check; this one is ours to gate on.
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4

  # `npm audit` on production dependencies only. Dev-only advisories are noisy
  # and do not ship to users.
  #
  # Blocking as of the react-router v7 upgrade in this same commit, which took
  # the count to zero. A PR that reintroduces a moderate-or-worse advisory in
  # a shipped dependency now fails here rather than merely reporting.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Matches NODE_VERSION in render.yaml. CI on 20 was testing a runtime
          # nothing runs: jsdom reaches worker_threads.markAsUncloneable
          # through undici, which does not exist before Node 22.10 (DN-95).
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
