name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The DB-backed suites (DN-99) need a real Postgres. Credentials and image
    # match docker-compose.yml, which is also what TEST_DATABASE_URL defaults
    # to in apps/api/src/test-support/database.ts -- change one and the step
    # below fails loudly rather than testing something else.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: regimen_works
          POSTGRES_PASSWORD: regimen_works
          POSTGRES_DB: regimen_works
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regimen_works"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Matches NODE_VERSION in render.yaml. CI on 20 was testing a runtime
          # nothing runs: jsdom reaches worker_threads.markAsUncloneable
          # through undici, which does not exist before Node 22.10 (DN-95).
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Separate from `npm run test`, which stays fast and needs no database.
      # Invoked explicitly so it cannot be silently skipped the way the old
      # e2e stub was (DN-48).
      - name: Database tests
        run: npm run test:db --workspace apps/api

      # The API through HTTP (DN-53). Its own step so a failure says whether
      # the request path or the query broke, and invoked explicitly for the
      # reason the last e2e suite died: one that nothing runs is one nobody
      # notices is dead (DN-48).
      - name: API e2e
        run: npm run test:e2e --workspace apps/api

      # Reports coverage for all three workspaces and fails if any has dropped
      # below its ratchet (DN-54). The api run re-runs both suites together
      # because a service covered only by its *.db-spec.ts would otherwise
      # report as untested.
      - name: Coverage
        run: npm run test:cov
